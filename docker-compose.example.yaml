services:
  opencode:
    container_name: opencode
    image: opencode:local  # tag applied to the build below; scheduler service reuses it
    labels:
      bpg.group: infra
      bpg.type: agents
    build:
      context: workspace/agents/opencode
      # Version pins intentionally absent: the Dockerfile ARG defaults are
      # empty (latest), and the offline store globs are the real lockfile.
      # Add e.g. OPENCODE_VERSION: "2.3.0" under build.args only to pin
      # deliberately. (The no-op `args: {}` was removed - compose passes no
      # build args unless declared.)
      # Arch follows TARGETARCH (amd64 -> x64); the offline store holds x64 tarballs.
      additional_contexts:
        preinstall: ./workspace/pre-installer
    init: true
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    ports:
      # Host loopback publish. With OPENCODE_BIND_LOCALHOST=1 the in-container
      # listener also drops to the container loopback (entrypoint BIND_HOST);
      # without it the server listens on all interfaces inside the container.
      - "127.0.0.1:4096:4096"
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TERM: xterm-256color
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_AUTH_REQUIRED: "true"
      OPENCODE_DEPLOY_MODE: ${OPENCODE_DEPLOY_MODE:-dev}
      OPENCODE_BIND_LOCALHOST: ${OPENCODE_BIND_LOCALHOST:-0}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SESSION_DIR: ${OPENCODE_SESSION_DIR:-/home/node/workspace/session}
      OPENCODE_CONFIG: /home/node/.config/opencode/opencode.json
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      SUMOPOD_BASE_MODEL: ${SUMOPOD_BASE_MODEL:-glm-5.3-flash}
      SUMOPOD_BASE_MODEL_NAME: ${SUMOPOD_BASE_MODEL_NAME:-glm-5.3-flash}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # Optional rag embeddings upgrade; empty keeps offline hashed-vector mode
      RAG_EMBEDDINGS_URL: ${RAG_EMBEDDINGS_URL:-}
      RAG_EMBEDDINGS_MODEL: ${RAG_EMBEDDINGS_MODEL:-}
      RAG_EMBEDDINGS_KEY: ${RAG_EMBEDDINGS_KEY:-}
    volumes:
      - ./workspace:/home/node/workspace
      - ./workspace/agents/opencode/config/opencode.json:/home/node/.config/opencode/opencode.json:ro
      - ./workspace/agents/opencode/rag:/opt/rag:ro
      - opencode-data:/home/node/.local/share/opencode
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Code-based probe: OpenCode's HTTP surface answers 200 (unauthenticated)
      # or 401 (basic auth challenge) - both are HEALTHY; only 5xx (or no
      # connection at all) is a failure. Plain `curl -fsS` false-reds on the
      # 401 auth challenge. Probe the container loopback (the server binds
      # 0.0.0.0 in-container; the shipped compose maps host loopback 4096).
      # start_period 90s: the MCP preflight can exceed 30s on cold boot.
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://[IP_ADDRESS]:4096/) && [ \"$$code\" -lt 500 ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    group_add:
      - "${DOCKER_GID:-101}"
  opencode-preinstall:
    image: node:22-bookworm-slim
    profiles: [ "tools" ]
    user: root
    volumes:
      - ./workspace:/repo
      # store lives at workspace root: ./workspace/pre-installer (single source)
    working_dir: /repo/agents/opencode
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends
      curl ca-certificates python3 python3-pip git openssl && sh /repo/agents/opencode/populate-preinstall.sh"

  opencode-scheduler:
    container_name: opencode-scheduler
    image: opencode:local
    profiles: ["scheduler"]
    depends_on: [opencode]
    restart: unless-stopped
    init: true
    working_dir: /home/node/workspace/agents/opencode/engine   # run_task invokes scripts/... relative to CWD
    volumes:
      - ./workspace:/home/node/workspace
    environment:
    command: >-
      sh -c "scripts/scheduled-runner.sh --task drift-detect --schedule daily
      --pid-file /tmp/scheduled-runner.pid && exec tail -F scheduled-runner.log"

  opencode-maintenance:
    image: opencode:local
    profiles: [ "scheduler" ]
    depends_on: [ opencode ]
    restart: unless-stopped
    init: true
    working_dir: /home/node/workspace/engine   # run_task invokes scripts/... relative to CWD
    volumes:
      - ./workspace/agents/opencode:/home/node/workspace
    command: >-
      sh -c "scripts/scheduled-runner.sh --task archive --schedule daily --pid-file /tmp/scheduled-archive.pid;
      scripts/scheduled-runner.sh --task heal --schedule daily --pid-file /tmp/scheduled-heal.pid"
  openui:
    container_name: openui
    image: openui-genui:local   # tag applied to the build below
    labels:
      bpg.group: infra
      bpg.type: agents
    build:
      context: workspace/agents/openui/app
    init: true
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:3000"
    environment:
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-REPLACE_ME}
      SUMOPOD_BASE_MODEL: ${SUMOPOD_BASE_MODEL:-glm-5.3-flash}
      SUMOPOD_BASE_MODEL_NAME: ${SUMOPOD_BASE_MODEL_NAME:-glm-5.3-flash}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode-data:
