services:
  # ============================================================================
  # CONTROL PLANE: CORE INFRASTRUCTURE (SCM, Secrets, Registry, CI/CD + TF)
  # ============================================================================
  gitea:
    container_name: gitea
    image: gitea/gitea:1.26.1-rootless
    labels:
      bpg.group: infra
      bpg.type: scm
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:2222"
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__SSH_PORT: 2222
      GITEA__service__DISABLE_REGISTRATION: "false"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  vault:
    container_name: vault
    image: hashicorp/vault:2.2
    labels:
      bpg.group: infra
      bpg.type: secrets
    restart: unless-stopped
    mem_limit: 256m
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_LOCAL_CONFIG: |
        {
          "storage": { "file": { "path": "/vault/file" } },
          "listener": [{ "tcp": { "address": "0.0.0.0:8200", "tls_disable": 1 } }],
          "ui": true,
          "disable_mlock": true
        }
    command: server
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    healthcheck:
      test: ["CMD-SHELL", "code=$$(wget -S -O /dev/null http://127.0.0.1:8200/v1/sys/health 2>&1 | awk '/HTTP\\// {print $$2}' | tail -n1); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"501\" ] || [ \"$$code\" = \"503\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
  registry:
    container_name: registry
    image: registry:2
    labels:
      bpg.group: infra
      bpg.type: registry
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '["http://localhost:8080"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '["HEAD", "GET", "OPTIONS", "DELETE"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '["Authorization", "Accept", "Cache-Control"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '["Docker-Content-Digest"]'
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
  registry-ui:
    container_name: registry-ui
    image: joxit/docker-registry-ui:main
    labels:
      bpg.group: infra
      bpg.type: registry
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - registry
    ports:
      - "127.0.0.1:8080:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: BPG Local Registry
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      NGINX_PROXY_PASS_URL: http://registry:5000
      PULL_URL: localhost:5000

  terraform:
    image: hashicorp/terraform:latest
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VAULT_ADDR: http://vault:8200

  # ============================================================================
  # CONTROL PLANE: AI AGENTS & UI
  # ============================================================================
  opencode:
    container_name: opencode
    image: opencode:local
    labels:
      bpg.group: infra
      bpg.type: agents
    build:
      context: workspace/agents/opencode
      additional_contexts:
        preinstall: ./workspace/pre-installer
    init: true
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TERM: xterm-256color
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_AUTH_REQUIRED: "true"
      OPENCODE_DEPLOY_MODE: ${OPENCODE_DEPLOY_MODE:-dev}
      OPENCODE_BIND_LOCALHOST: ${OPENCODE_BIND_LOCALHOST:-0}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENCODE_SESSION_DIR: ${OPENCODE_SESSION_DIR:-/home/node/workspace/session}
      OPENCODE_CONFIG: /home/node/.config/opencode/opencode.json
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      SUMOPOD_BASE_MODEL: ${SUMOPOD_BASE_MODEL:-glm-5.3-flash}
      SUMOPOD_BASE_MODEL_NAME: ${SUMOPOD_BASE_MODEL_NAME:-glm-5.3-flash}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      RAG_EMBEDDINGS_URL: ${RAG_EMBEDDINGS_URL:-}
      RAG_EMBEDDINGS_MODEL: ${RAG_EMBEDDINGS_MODEL:-}
      RAG_EMBEDDINGS_KEY: ${RAG_EMBEDDINGS_KEY:-}
    volumes:
      - ./workspace:/home/node/workspace
      - ./workspace/agents/opencode/config/opencode.json:/home/node/.config/opencode/opencode.json:ro
      - ./workspace/agents/opencode/rag:/opt/rag:ro
      - opencode-data:/home/node/.local/share/opencode
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4096/) && [ \"$$code\" -lt 500 ] || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    group_add:
      - "${DOCKER_GID:-101}"
  opencode-preinstall:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    user: root
    volumes:
      - ./workspace:/repo
    working_dir: /repo/agents/opencode
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends
      curl ca-certificates python3 python3-pip git openssl && sh /repo/agents/opencode/populate-preinstall.sh"

  opencode-scheduler:
    container_name: opencode-scheduler
    image: opencode:local
    profiles: ["scheduler"]
    depends_on: [opencode]
    restart: unless-stopped
    init: true
    working_dir: /home/node/workspace/agents/opencode/engine
    volumes:
      - ./workspace:/home/node/workspace
    command: >-
      sh -c "scripts/scheduled-runner.sh --task drift-detect --schedule daily
      --pid-file /tmp/scheduled-runner.pid && exec tail -F scheduled-runner.log"

  opencode-maintenance:
    image: opencode:local
    profiles: ["scheduler"]
    depends_on: [opencode]
    restart: unless-stopped
    init: true
    working_dir: /home/node/workspace/engine
    volumes:
      - ./workspace/agents/opencode:/home/node/workspace
    command: >-
      sh -c "scripts/scheduled-runner.sh --task archive --schedule daily --pid-file /tmp/scheduled-archive.pid;
      scripts/scheduled-runner.sh --task heal --schedule daily --pid-file /tmp/scheduled-heal.pid"

  openui:
    container_name: openui
    image: openui-genui:local
    labels:
      bpg.group: infra
      bpg.type: agents
    build:
      context: workspace/agents/openui/app
    init: true
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:3000"
    environment:
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-REPLACE_ME}
      SUMOPOD_BASE_MODEL: ${SUMOPOD_BASE_MODEL:-glm-5.3-flash}
      SUMOPOD_BASE_MODEL_NAME: ${SUMOPOD_BASE_MODEL_NAME:-glm-5.3-flash}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  kestra-postgres:
    container_name: kestra-postgres
    image: postgres:16-alpine
    labels:
      bpg.group: infra
      bpg.type: cicd
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:-kestra}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kestra -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 20

  kestra:
    container_name: kestra
    # all-in-one server (image default CMD is --help; without this the
    # container prints usage and exits 0 in a restart loop)
    command: server standalone
    image: kestra-ca:local
    labels:
      bpg.group: infra
      bpg.type: cicd
    build:
      context: ./workspace/infrastructure/cicd/kestra
      args:
        KESTRA_BASE: ${KESTRA_BASE:-kestra/kestra:v1.3.26-no-plugins}
        KESTRA_PLUGINS: ${KESTRA_PLUGINS:-io.kestra.plugin:plugin-git:1.3.0 io.kestra.plugin:plugin-script-shell:1.3.0}
    restart: unless-stopped
    init: true
    mem_limit: 4g
    stop_grace_period: 1m
    depends_on:
      kestra-postgres:
        condition: service_healthy
    networks:
      - default
      - platform
    ports:
      - "127.0.0.1:4800:8080"
    # root is required for the docker socket (Docker task runner);
    # drop the socket mounts and this line if tasks only use the Process runner
    user: "root"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2500m"
      SECRET_VAULT_TOKEN: ${SECRET_VAULT_TOKEN_B64:-}
      SECRET_WEBHOOK_KEY: ${SECRET_WEBHOOK_KEY_B64:-}
      DEPLOYER_WORK_DIR: /app/deployer
      DEPLOYER_WORK_HOST_DIR: ${DEPLOYER_WORK_DIR:?set DEPLOYER_WORK_DIR in .env - absolute host path for the deployer workspace}
      VAULT_ADDR: http://vault:8200
      KESTRA_CONFIGURATION: |
        logger:
          levels:
            org.flywaydb: WARN
            org.jooq.impl.Dialect: ERROR
            org.jooq.impl.Dialect.logVersionSupport: ERROR
            io.micrometer.prometheus.PrometheusMeterRegistry: ERROR
            io.micrometer.prometheusmetrics.PrometheusMeterRegistry: ERROR
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /app/provisioning
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:-kestra}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: "/tmp/kestra-wd/tmp"
          server:
            basic-auth:
              username: ${KESTRA_ADMIN_USER:-admin@kestra.io}
              password: ${KESTRA_ADMIN_PASSWORD:-KestraAdmin123}
          url: http://localhost:4800/
    volumes:
      - kestra-data:/app/storage
      - ${DEPLOYER_WORK_DIR:?set DEPLOYER_WORK_DIR in .env - absolute host path for the deployer workspace}:/app/deployer
      - kestra-wd:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd

volumes:
  gitea-data:
  gitea-config:
  vault-data:
  vault-logs:
  registry-data:
  kestra-data:
  kestra-postgres-data:
  opencode-data:
networks:
  platform:
    external: true
    name: ${KESTRA_PLATFORM_NETWORK:-bpgv5-network}
