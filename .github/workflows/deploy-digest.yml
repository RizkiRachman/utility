name: Deploy digest to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Pages project exists
        run: npx wrangler pages project create utility-digest --production-branch=main || echo "project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build skills catalog
        run: |
          python3 - <<'PYEOF'
          import os, json, re, shutil
          src_root = 'workspace/agents/opencode/engine/skills'
          out = 'public/skills'
          os.makedirs(out, exist_ok=True)
          index = []
          for name in sorted(os.listdir(src_root)):
              d = os.path.join(src_root, name)
              if not os.path.isdir(d):
                  continue
              dst = os.path.join(out, name)
              shutil.copytree(d, dst, ignore=shutil.ignore_patterns("data", "node_modules", "__pycache__"))
              desc = ''
              md = os.path.join(d, 'SKILL.md')
              if os.path.exists(md):
                  txt = open(md, encoding='utf-8', errors='replace').read(4000)
                  m = re.search(r'^description:\s*(.+?)(?:\n[a-z-]+:|\n---)', txt, re.M | re.S)
                  if m:
                      desc = ' '.join(m.group(1).split())[:200]
              index.append({'name': name, 'description': desc, 'url': 'skills/' + name + '/SKILL.md'})
          json.dump({'count': len(index), 'skills': index}, open('public/skills.json', 'w'), indent=1)
          print('skills catalog:', len(index), 'skills')
          PYEOF
      - name: Build slim digest
        run: |
          mkdir -p public
          npx -y repomix@latest --include "workspace/agents/opencode/**" --ignore "**/node_modules/**,**/skills/**/data/**,**/skills/**/scripts/tests/**,**/*.csv,**/*.html,**/library/**,**/references/**,**/fixtures/**,**/fonts/**" --style plain --output public/repomix-output.txt
      - name: Split into model-sized parts
        run: |
          python3 - <<'PYEOF'
          import re, json, os
          src = open('public/repomix-output.txt', encoding='utf-8', errors='replace').read()
          blocks = re.split(r'(?=\n================\nFile:)', src)
          parts, cur, size = [], [], 0
          for b in blocks[1:]:
              if size + len(b) > 600000 and cur:
                  parts.append(''.join(cur)); cur, size = [], 0
              cur.append(b); size += len(b)
          if cur: parts.append(''.join(cur))
          links = []
          for i, p in enumerate(parts, 1):
              fn = f'digest-part-{i:02d}.txt'
              open(f'public/{fn}', 'w', encoding='utf-8').write(f'# Utility digest - part {i}/{len(parts)} (scope: workspace/agents/opencode)\n' + p)
              links.append(f'<p><a href="{fn}">{fn}</a> ({len(p)//1024} KB)</p>')
          nskills = 0
          if os.path.exists('public/skills.json'):
              nskills = json.load(open('public/skills.json'))['count']
          html = '<!doctype html><meta charset="utf-8"><title>utility digest</title><h1>Utility source digest</h1>'
          html += f'<p>Slim audit digest: {len(parts)} parts (~150k tokens each) | <a href="skills.json">skills.json</a> ({nskills} skills, per-skill pages under /skills/)</p>'
          html += "".join(links)
          html += '<p><a href="repomix-output.txt">full single file (for shell agents)</a></p>'
          open('public/index.html', 'w', encoding='utf-8').write(html)
          print(f'wrote {len(parts)} parts, catalog {nskills} skills')
          PYEOF
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=utility-digest --commit-dirty=true
