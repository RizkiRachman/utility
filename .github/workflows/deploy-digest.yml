name: Deploy digest to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Pages project exists
        run: npx wrangler pages project create utility-digest --production-branch=main || echo "project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build digest
        run: |
          mkdir -p public
          npx -y repomix@latest --include "workspace/agents/opencode/**" --ignore "**/node_modules/**,**/skills/**/data/**,**/*.csv,**/*.html" --style plain --output public/repomix-output.txt
      - name: Split into model-sized parts
        run: |
          python3 - <<'PYEOF'
          import re
          src = open('public/repomix-output.txt', encoding='utf-8', errors='replace').read()
          blocks = re.split(r'(?=\n================\nFile:)', src)
          parts, cur, size = [], [], 0
          for b in blocks[1:]:
              if size + len(b) > 600000 and cur:
                  parts.append(''.join(cur)); cur, size = [], 0
              cur.append(b); size += len(b)
          if cur: parts.append(''.join(cur))
          links = []
          for i, p in enumerate(parts, 1):
              fn = f'digest-part-{i:02d}.txt'
              open(f'public/{fn}', 'w', encoding='utf-8').write(f'# Utility digest - part {i}/{len(parts)} (scope: workspace/agents/opencode)\n' + p)
              links.append(f'<p><a href="{fn}">{fn}</a> ({len(p)//1024} KB)</p>')
          html = '<!doctype html><meta charset="utf-8"><title>utility digest</title><h1>Utility source digest</h1><p>Scope: workspace/agents/opencode - one part per chat upload (~150k tokens each)</p>' + ''.join(links) + '<p><a href="repomix-output.txt">full single file (large, for shell agents)</a></p>'
          open('public/index.html', 'w', encoding='utf-8').write(html)
          print(f'wrote {len(parts)} parts')
          PYEOF
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=utility-digest --commit-dirty=true
