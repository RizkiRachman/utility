# DIGEST DEPLOYMENT POLICY: this workflow POPULATES and DEPLOYS the source
# digest (repomix pack + skills catalog) to Cloudflare Pages. It runs ONLY on
# push to refs/heads/main and on manual workflow_dispatch. Pull requests and
# feature branches never deploy or populate digests; PR runs get read-only
# verification only (validate.yml "Offline store digest gate").
# Artifact-digest population (--update-digests) is a maintainer local run and
# is never a CI step in either workflow.
name: Deploy digest to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PAGES_PROJECT: utility-digest
  PAGES_BRANCH: main
  PAGES_URL: https://utility-digest.pages.dev
  WORKER_NAME: utility
  WORKER_URL: https://utility.rizkifaizalr.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Pages project exists
        run: npx wrangler pages project create "${PAGES_PROJECT}" --production-branch="${PAGES_BRANCH}" || echo "project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build skills catalog
        run: |
          python3 - <<'PYEOF'
          import os, json, re, shutil
          src_root = 'workspace/agents/opencode/engine/skills'
          out = 'public/skills'
          os.makedirs(out, exist_ok=True)
          index = []
          for name in sorted(os.listdir(src_root)):
              d = os.path.join(src_root, name)
              if not os.path.isdir(d):
                  continue
              dst = os.path.join(out, name)
              shutil.copytree(d, dst, ignore=shutil.ignore_patterns("data", "node_modules", "__pycache__"))
              desc = ''
              md = os.path.join(d, 'SKILL.md')
              if os.path.exists(md):
                  txt = open(md, encoding='utf-8', errors='replace').read(4000)
                  m = re.search(r'^description:\s*(.+?)(?:\n[a-z-]+:|\n---)', txt, re.M | re.S)
                  if m:
                      desc = ' '.join(m.group(1).split())[:200]
              index.append({'name': name, 'description': desc, 'url': 'skills/' + name + '/SKILL.md'})
          json.dump({'count': len(index), 'skills': index}, open('public/skills.json', 'w'), indent=1)
          print('skills catalog:', len(index), 'skills')
          PYEOF
      - name: Build slim digest
        run: sh scripts/pages-build.sh
      # SELF-HEAL: the git-integrated Pages project's dashboard build command
      # predates this workflow and still passes the removed --exclude flag,
      # which fails every PR preview build. PATCH the dashboard command to the
      # canonical script; a no-op when the project is not git-connected.
      - name: Sync Pages dashboard build command (self-heal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X PATCH "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"build_config":{"build_command":"sh scripts/pages-build.sh","destination_dir":"public"}}' \
            | grep -q '"success":true' && echo "pages build config synced to sh scripts/pages-build.sh" \
            || echo "WARN: build-config sync skipped (project absent, not git-connected, or token lacks Pages:Edit) - the dashboard command may still use the removed --exclude flag"
      - name: Build agent digest (shards + llms.txt + manifest + per-file)
        run: |
          python3 scripts/build-digest-index.py --input public/repomix-output.txt --out public --cap 92160 --budget 1048576
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.PAGES_PROJECT }} --branch=${{ env.PAGES_BRANCH }} --commit-dirty=true

      - name: Publish agent proxy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js","compatibility_date":"2025-01-01"};type=application/json' \
            -F 'worker.js=@worker/worker.js;type=application/javascript+module' \
            | grep -o '"success":[a-z]*'

      - name: Verify Live Endpoints
        run: |
          echo "Verifying Cloudflare Pages and Worker deployment..."
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /tmp/pages-llms.txt "${PAGES_URL}/llms.txt" 2>/dev/null && \
               test -s /tmp/pages-llms.txt && \
               curl -fsS -o /dev/null "${PAGES_URL}/chunks/01.txt" 2>/dev/null && \
               curl -fsS -o /tmp/worker-llms.txt "${WORKER_URL}/llms.txt" 2>/dev/null && \
               test -s /tmp/worker-llms.txt; then
              ok=1
              break
            fi
            echo "Waiting for edge propagation (attempt $i/6)..."
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: Live endpoints failed verification" >&2
            echo "--- Pages /llms.txt probe ---"
            curl -sv "${PAGES_URL}/llms.txt" || true
            echo "--- Worker /llms.txt probe ---"
            curl -sv "${WORKER_URL}/llms.txt" || true
            exit 1
          fi
          echo "Verified live digest endpoints successfully."
