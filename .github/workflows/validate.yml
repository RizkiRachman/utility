name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow schema validator
        run: python -m pip install 'jsonschema>=4,<5'

      # Parse-only, output discarded: config/opencode.json may hold
      # placeholder secrets that must never be printed to the log.
      - name: JSON validity
        run: |
          for f in \
            workspace/agents/opencode/engine/contract/*.json \
            workspace/agents/opencode/engine/rules/rules.json \
            workspace/agents/opencode/engine/rules/rules.schema.json \
            workspace/agents/opencode/engine/opencode.json.template \
            workspace/agents/opencode/config/opencode.json
          do
            echo "Parsing $f"
            jq -e . "$f" > /dev/null
          done

      - name: Script syntax (bash -n sweep)
        run: |
          for f in workspace/agents/opencode/engine/scripts/*.sh \
                    workspace/agents/opencode/engine/setup.sh \
                    workspace/agents/opencode/entrypoint.sh \
                    workspace/agents/opencode/populate-preinstall.sh \
                    workspace/agents/opencode/apt-closure.sh \
                    workspace/agents/opencode/apt-install.sh \
                    workspace/agents/opencode/test-apt-offline.sh \
                    workspace/agents/opencode/engine/scripts/check-docker-context.sh \
                    workspace/certs/*.sh; do
            bash -n "$f"
          done
          echo "All scripts pass bash -n"

      # The engine check scripts resolve their own engine root from the
      # script location; project-root-relative paths stay valid from the
      # working directory below.
      - name: Cross-reference integrity
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-cross-references.sh

      - name: Doc style gate (humanizer)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-doc-style.sh "$GITHUB_WORKSPACE/README.md"

      - name: Contract validation
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/validate-contract.sh --file engine/contract/contract.template.json --score

      # DIGEST POLICY: this gate is READ-ONLY verification (--verify-digests
      # hashes the store against pre-install/digests.sha256; nothing is
      # written, uploaded, or populated). Digest DEPLOYMENT (the Cloudflare
      # Pages source digest) and artifact-digest POPULATION (--update-digests,
      # a maintainer local run) never happen on pull_request or feature-branch
      # events: deployment runs only on push to refs/heads/main in
      # .github/workflows/deploy-digest.yml.
      # Digest gate (S3/P2-9): the offline store is gitignored, so CI runs the
      # offline verify only when a populated store happens to exist
      # (self-hosted runners). With 0 pins (comment-only manifest) the step
      # skips loudly - that is pre-population state, not enforcement. The
      # authoritative enforcement points are the Dockerfile build gate and
      # the end-of-run re-verification inside populate-preinstall.sh.
      - name: Offline store digest gate
        working-directory: workspace/agents/opencode
        run: |
          pins=$(grep -cvE '^[[:space:]]*(#|$)' pre-install/digests.sha256 2>/dev/null || true)
          if [ -z "$pins" ]; then pins=0; fi
          if [ "$pins" -eq 0 ]; then
            echo "digest gate: 0 pins in pre-install/digests.sha256 - SKIPPING (pre-population; run --update-digests once with network access to enable)"
          elif [ -d ../../pre-installer/npm ] || [ -d ../../pre-installer/pip ]; then
            echo "digest gate: $pins pin(s) recorded - enforcing (populate-preinstall.sh --verify-digests)"
            sh populate-preinstall.sh --verify-digests
          else
            echo "digest gate: $pins pin(s) recorded but store absent from CI (gitignored) - offline verify deferred to the Dockerfile build gate and populate runs"
          fi

      # TRACKED-INVENTORY SANITY CHECK: this verifies the cert files committed
      # to the repo match certs-allowlist.txt. The ENFORCING copy of the same
      # check runs where certs actually land - at the end of
      # certs/sync-certs.sh (called by populate-preinstall.sh on every
      # populate run), which fails the sync on any non-allowlisted cert.
      - name: Apt offline tests
        run: sh workspace/agents/opencode/test-apt-offline.sh

      - name: Docker context check
        run: bash workspace/agents/opencode/engine/scripts/check-docker-context.sh

      - name: Certificates allowlist (tracked-inventory sanity)
        working-directory: workspace
        run: sh certs/check-certs.sh

      # Cert detector unit tests (P3-15): extraction, prefix, non-zscaler
      # rejection and fingerprint dedupe. Pure-shell, offline.
      - name: Cert detector tests
        working-directory: workspace
        run: sh certs/test-detect-zscaler.sh

      # Blocking. Session-derived checks self-skip in a source checkout with
      # no live session/; every other convention must pass.
      - name: Conventions (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-conventions.sh

      - name: Model config drift (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-model-config-drift.sh

      - name: Score calibration (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T4-score-calibration.sh

      - name: Controller integration (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T5-controller-integration.sh

      - name: Judge coverage (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T6-judge-coverage.sh

      - name: Phase telemetry (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T7-telemetry.sh

      - name: Context provenance (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T8-context-provenance.sh

      - name: Judge agreement (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T9-judge-agreement.sh

      - name: BLOCKED SLA (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T10-blocked-sla.sh

      - name: Parallel shard merge (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T11-merge-shards.sh

      - name: Shell policy (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T12-shell-policy.sh

      - name: Prompt budget (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T13-prompt-budget.sh

      - name: Plugin registration (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T14-plugin-registration.sh

      - name: Deployed config registration (blocking)
        working-directory: workspace/agents/opencode
        run: PLUGIN_REGISTERED_PATH=/opt/engine/plugins/opencode-workflow-guard bash engine/scripts/check-plugin-registration.sh config/opencode.json engine/plugins/opencode-workflow-guard

      - name: Enforcement gates (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T15-enforcement-gates.sh

      - name: Shard recovery (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T16-shard-recovery.sh

      - name: Telemetry coverage (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T17-telemetry-coverage.sh

      - name: Learning impact (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T18-learning-impact.sh

      - name: Failure loop (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T19-failure-loop.sh

      - name: Doc hygiene (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T20-doc-hygiene.sh

      - name: Contract validator (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T1-validate-contract.sh

      - name: Contract persistence (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T21-contract-persistence.sh

      - name: State guard CLI (blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/eval-tasks/T22-state-guard-cli.sh
