name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Parse-only, output discarded: config/opencode.json may hold
      # placeholder secrets that must never be printed to the log.
      - name: JSON validity
        run: |
          for f in \
            workspace/agents/opencode/engine/contract/*.json \
            workspace/agents/opencode/engine/rules/rules.json \
            workspace/agents/opencode/engine/rules/rules.schema.json \
            workspace/agents/opencode/engine/opencode.json.template \
            workspace/agents/opencode/config/opencode.json
          do
            echo "Parsing $f"
            jq -e . "$f" > /dev/null
          done

      - name: Script syntax (bash -n sweep)
        run: |
          for f in workspace/agents/opencode/engine/scripts/*.sh \
                    workspace/agents/opencode/engine/setup.sh \
                    workspace/agents/opencode/entrypoint.sh; do
            bash -n "$f"
          done
          echo "All scripts pass bash -n"

      # The engine check scripts resolve their own engine root from the
      # script location; project-root-relative paths stay valid from the
      # working directory below.
      - name: Cross-reference integrity
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-cross-references.sh

      - name: Doc style gate (humanizer)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-doc-style.sh "$GITHUB_WORKSPACE/README.md"

      - name: Contract validation
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/validate-contract.sh --file engine/contract/contract.template.json --score

      # Non-blocking for now: the convention rule set is still maturing;
      # flip to blocking once the remaining rules are verified clean.
      - name: Conventions (non-blocking)
        working-directory: workspace/agents/opencode
        run: bash engine/scripts/check-conventions.sh || true
