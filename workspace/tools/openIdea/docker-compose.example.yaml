---
name: openidea

# One image, two display modes. Pick with --profile web or --profile x11.
# Both profiles share the same build; the second service reuses the image.
services:
  openidea-web:
    container_name: openidea-web
    image: openidea:local
    profiles: ["web"]
    labels:
      bpg.group: infra
      bpg.type: tools
    build:
      context: .
      args:
        OPENIDEA_VERSION: "" # empty = latest release at build time
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4190:4190" # noVNC; loopback only (x11vnc runs without a password)
    environment:
      MODE: web
      NOVNC_PORT: "4190"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TERM: xterm-256color
    volumes:
      - ./project:/home/ide/project
      - openidea-config:/home/ide/.config/OpenIDEA
      - /var/run/docker.sock:/var/run/docker.sock

  openidea-x11:
    container_name: openidea-x11
    image: openidea:local
    profiles: ["x11"]
    labels:
      bpg.group: infra
      bpg.type: tools
    build:
      context: .
      args:
        OPENIDEA_VERSION: "" # empty = latest release at build time
    init: true
    restart: unless-stopped
    environment:
      MODE: x11
      DISPLAY: ":0"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TERM: xterm-256color
    volumes:
      - ./project:/home/ide/project
      - openidea-config:/home/ide/.config/OpenIDEA
      - /tmp/.X11-unix:/tmp/.X11-unix
      # WSLg only; drop this line on plain Linux X11 hosts.
      - /mnt/wslg:/mnt/wslg
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  openidea-config: