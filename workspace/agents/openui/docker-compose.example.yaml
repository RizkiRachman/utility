# Standalone example: build + run the OpenUI generative-UI service.
#   cp .env.example .env   (fill SUMOPOD_API_KEY)
#   docker compose -f docker-compose.example.yaml up -d --build
#
# Browser chat UI : http://localhost:8102
# opencode (MCP)  : agents/openui/mcp-bridge.mjs -> http://openui:3000
#                   (requires both containers on utility_default)
name: openui

services:
  openui:
    container_name: openui
    image: openui-genui:local   # tag applied to the build below
    labels:
      bpg.group: infra
      bpg.type: agents
    build:
      context: ./app
      dockerfile: Dockerfile
    init: true
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:3000"
    environment:
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-REPLACE_ME}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      # Corporate CA: baked into the image from app/certs/ (see Dockerfile).
      # Rotate: drop a new .crt into app/certs/ (gitignored) and rebuild.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - utility_default   # root stack network: opencode resolves http://openui:3000

networks:
  utility_default:
    external: true
