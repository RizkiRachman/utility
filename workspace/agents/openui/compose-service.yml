  # 3. OpenUI generative-UI app (thesysdev/openui scaffold) - model: sumopod GLM
  #    Browser chat UI at http://localhost:8102 - opencode reaches it via MCP bridge
  openui:
    build:
      context: workspace/agents/openui/app
      dockerfile: Dockerfile
    image: openui-genui:local
    container_name: openui
    ports:
      - "127.0.0.1:8102:3000"
    environment:
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:?fill SUMOPOD_API_KEY in .env}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      # Corporate CA: baked into the image from app/certs/ (see Dockerfile).
      # Rotate: drop a new .crt into app/certs/ (gitignored) and rebuild.
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
