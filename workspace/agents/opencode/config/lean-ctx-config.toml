# lean-ctx runtime config, baked into the image at /home/node/.config/lean-ctx/config.toml
# by the Dockerfile (the COPY right after the opencode.json bake).
#
# shell_allowlist_extra = commands merged ON TOP of the lean-ctx built-in
# read-only allowlist, so ctx_shell accepts them instead of returning [BLOCKED].
# It extends the allowlist; it never removes a built-in entry.
#
# Adding a command, two ways:
#   1. at runtime: `lean-ctx allow <cmd>` (persists to this file; takes effect
#      immediately), or
#   2. edit this list and rebuild the image.
#
# Escape hatches (only if you accept the loss of command gating):
#   shell_allowlist = []        # no extra commands at all
#   shell_security = "off"      # disable shell security checks entirely
#
# Keep general-purpose entries as bare command names. Agents cannot widen their
# own policy at runtime by design, which is why this ships baked from the repo.
#
# --- Baseline general commands -------------------------------------------
# docker/ss: sandbox container and port inspection (compose stack management).
# sh/bash/sudo: interpreters - see the interpreter security note at the bottom.
shell_allowlist_extra = [
  "docker", "sh", "bash", "sudo", "ss",

  # python3: scratch patchers under /tmp/opencode/*.py (printf-written, py_compiled before run).
  # Strictly narrower than sh/bash above; pattern guards (-c blocks, word-parens) still apply.
  "python3",

  # --- Workflow engine gate scripts (validator/automation only) ----------
  # Rationale: these are the contract state-machine gates that agent.md orders
  # every agent to run. All nine are engine-shipped, read-only validators or
  # local state writers under /opt/engine/scripts; they make no network calls
  # and add no interpreter surface beyond sh/bash above. Without these entries
  # the pre-flight gate is advisory only: agents get [BLOCKED] and skip it.
  # Both path and basename forms are listed because lean-ctx matches the head
  # token of the command as typed.
  "/opt/engine/scripts/validate-contract.sh",
