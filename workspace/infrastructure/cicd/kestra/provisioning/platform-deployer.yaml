id: platform-deployer
namespace: platform
description: |
  Platform deployer (Layer 1) - plans, applies or destroys a web-deployer
  platform for a repository. Repository URL and Repository Name are mandatory
  (no defaults): every run states exactly what it targets. Action is a SELECT
  with three fixed values, so an invalid pick is impossible.
labels:
  bpg.group: cicd
  bpg.type: provisioning
inputs:
  - id: repository_url
    type: STRING
    displayName: Repository URL
    required: true
  - id: repository_name
    type: STRING
    displayName: Repository Name
    required: true
  - id: action
    type: SELECT
    displayName: Action
    values: [plan, apply, destroy]
    defaults: plan
tasks:
  - id: announce
    type: io.kestra.plugin.core.log.Log
    message: |
      platform-deployer run - action={{ inputs.action }}
      repository: {{ inputs.repository_name }}
      url: {{ inputs.repository_url }}
      desired stages: build, deploy, automation-tests, unit-test
  - id: record_apply
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ inputs.action == \"apply\" }}"
    namespace: platform
    key: "state-{{ inputs.repository_name | slugify }}"
    value: "applied - stages: build, deploy, automation-tests, unit-test"
  - id: record_destroy
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ inputs.action == \"destroy\" }}"
    namespace: platform
    key: "state-{{ inputs.repository_name | slugify }}"
    value: "destroyed"
  - id: read_state
    type: io.kestra.plugin.core.kv.Get
    runIf: "{{ inputs.action == \"plan\" }}"
    namespace: platform
    key: "state-{{ inputs.repository_name | slugify }}"
    errorOnMissing: false
  - id: report_plan
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ inputs.action == \"plan\" }}"
    message: "plan result: {{ outputs.read_state.value ?? \"no deployed state - will create 4 stages: build, deploy, automation-tests, unit-test\" }}"
  - id: report_apply
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ inputs.action == \"apply\" }}"
    message: "apply done - reconciled state recorded in namespace KV store"
  - id: report_destroy
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ inputs.action == \"destroy\" }}"
    message: "destroy done - state marked removed"
outputs:
  - id: result
    type: STRING
    value: "action={{ inputs.action }} repository={{ inputs.repository_name }}"
