id: platform-secrets
namespace: platform
description: |
  Secrets wiring for the platform namespace. Reads the Gitea token from
  Vault (KV v2 at general/cicd/kestra) using the Vault token provided via
  the SECRET_VAULT_TOKEN env secret, verifies it against the Gitea API,
  and records the resolved identity in the namespace KV store. The Gitea
  token itself never lives in kestra - only in Vault.
labels:
  bpg.group: cicd
  bpg.type: provisioning
tasks:
  - id: read_vault
    type: io.kestra.plugin.core.http.Request
    uri: "http://vault:8200/v1/general/data/cicd/kestra"
    method: GET
    headers:
      X-Vault-Token: "{{ secret('VAULT_TOKEN') }}"
  - id: verify_gitea
    type: io.kestra.plugin.core.http.Request
    uri: "{{ json(outputs.read_vault.body).data.data.gitea_url }}/api/v1/user"
    method: GET
    headers:
      Authorization: "token {{ json(outputs.read_vault.body).data.data.gitea_token }}"
  - id: record
    type: io.kestra.plugin.core.kv.Set
    namespace: platform
    key: gitea-identity
    value: "{{ json(outputs.verify_gitea.body).login }}"
outputs:
  - id: gitea_user
    type: STRING
    value: "{{ json(outputs.verify_gitea.body).login }}"
