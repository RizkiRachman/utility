# Kestra stack - CI/CD-agnostic orchestrator (flows as code, catalog-driven dialogs).
# Sits beside cicd/semaphore as an alternative platform; image built from this folder
# (base kestra/kestra + corporate CA chain) so tasks can reach HTTPS endpoints via Zscaler.
#
# Usage:
#   docker compose -f workspace/infrastructure/cicd/kestra/docker-compose.example.yaml -p kestra up -d --build
# UI: http://127.0.0.1:4800 (admin@kestra.io / KESTRA_ADMIN_PASSWORD)

volumes:
  kestra-postgres-data:
  kestra-data:
  kestra-wd:

services:
  kestra-postgres:
    container_name: kestra-postgres
    image: postgres:16-alpine
    labels:
      bpg.group: infra
      bpg.type: cicd
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:-kestra}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d kestra -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 20

  kestra:
    container_name: kestra
    image: kestra-ca:local
    labels:
      bpg.group: infra
      bpg.type: cicd
    build:
      context: ./workspace/infrastructure/cicd/kestra
      args:
        KESTRA_BASE: ${KESTRA_BASE:-kestra/kestra:v1.3.26-no-plugins}
        KESTRA_PLUGINS: ${KESTRA_PLUGINS:-}
    restart: unless-stopped
    init: true
    mem_limit: 4g
    stop_grace_period: 1m
    depends_on:
      kestra-postgres:
        condition: service_healthy
    networks:
      - default
      - platform
    ports:
      - "127.0.0.1:4800:8080"
    # root is required to use the docker socket for the Docker task runner
    # (same tradeoff as the official kestra compose; drop the socket mounts
    # and this line if tasks only use the Process runner)
    user: "root"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2500m"
      SECRET_VAULT_TOKEN: ${SECRET_VAULT_TOKEN_B64:-}
      VAULT_ADDR: http://vault:8200
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:-kestra}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: "/tmp/kestra-wd/tmp"
          server:
            basic-auth:
              username: ${KESTRA_ADMIN_USER:-admin@kestra.io}
              password: ${KESTRA_ADMIN_PASSWORD:-KestraAdmin123}
          url: http://localhost:4800/
    volumes:
      - kestra-data:/app/storage
      - kestra-wd:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
networks:
  platform:
    external: true
    name: ${KESTRA_PLATFORM_NETWORK:-bpgv5-network}
