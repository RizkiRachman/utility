# Standalone example: keep the cocoindex-code daemon, index and model cache
# warm outside the opencode image. The per-session MCP server is a short-lived
# stdio container (config-entry.json); it reaches the daemon through the shared
# ~/.cocoindex_code mount (unix socket), so no docker network is needed.
#
#   docker compose -f docker-compose.example.yaml up -d     # start holder
#   docker compose -f docker-compose.example.yaml down      # stop; index + model stay
#
# Not wired into config/opencode.json yet: the legacy in-image `ccc mcp` stays
# active until the config entry is switched (see README).
name: ccc

services:
  cocoindex-code:
    container_name: cocoindex-code
    image: ccc-mcpserver:local
    labels:
      bpg.group: infra
      bpg.type: ai
    init: true
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      HOME: /home/node
    working_dir: /home/node/workspace
    volumes:
      - "${CCC_WORKSPACE_DIR:-/home/node/workspace}:/home/node/workspace"
      - "${CCC_STATE_DIR:-/home/node/.cocoindex_code}:/home/node/.cocoindex_code"
      - "${CCC_MODEL_CACHE_DIR:-/home/node/.cache/huggingface}:/home/node/.cache/huggingface"
    healthcheck:
      # Self-healing: `ccc daemon status` respawns the daemon if it exited.
      test: ["CMD", "ccc", "daemon", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
